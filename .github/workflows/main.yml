name: CI
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
    - name: Get dependencies
      run: flutter pub get

    - name: Dart Format Check
      run: dart format --set-exit-if-changed .

    - name: Run tests
      run: flutter test